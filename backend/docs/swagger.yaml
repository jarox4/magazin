basePath: /api
definitions:
  main.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/main.UserMe'
    type: object
  main.Category:
    properties:
      id:
        example: 1
        type: integer
      name:
        example: Electronics
        type: string
    type: object
  main.CreateOrderInput:
    properties:
      address:
        type: string
      items:
        items:
          $ref: '#/definitions/main.OrderItemInput'
        minItems: 1
        type: array
      notes:
        type: string
      phone:
        type: string
    required:
    - address
    - items
    - phone
    type: object
  main.DeletedResponse:
    properties:
      deleted:
        type: boolean
    type: object
  main.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  main.IDResponse:
    properties:
      id:
        type: integer
    type: object
  main.InventoryInput:
    properties:
      category_id:
        type: integer
      date_received:
        type: string
      description:
        type: string
      expiry_date:
        type: string
      image_url:
        type: string
      inventory_number:
        type: string
      manufacturer_id:
        type: integer
      name:
        type: string
      price:
        minimum: 0
        type: number
      quantity:
        minimum: 0
        type: integer
      shelf_life_days:
        type: integer
    required:
    - category_id
    - date_received
    - inventory_number
    - manufacturer_id
    - name
    - price
    type: object
  main.InventoryItem:
    properties:
      category_id:
        type: integer
      category_name:
        type: string
      created_at:
        type: string
      date_received:
        type: string
      description:
        type: string
      expiry_date:
        type: string
      id:
        type: integer
      image_url:
        type: string
      inventory_number:
        type: string
      manufacturer_id:
        type: integer
      manufacturer_name:
        type: string
      name:
        type: string
      price:
        type: number
      quantity:
        type: integer
      shelf_life_days:
        type: integer
      updated_at:
        type: string
    type: object
  main.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  main.Manufacturer:
    properties:
      id:
        example: 1
        type: integer
      name:
        example: Acme Corp
        type: string
    type: object
  main.Order:
    properties:
      address:
        type: string
      created_at:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/main.OrderItem'
        type: array
      notes:
        type: string
      phone:
        type: string
      status:
        type: string
      total_price:
        type: number
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  main.OrderItem:
    properties:
      id:
        type: integer
      inventory_id:
        type: integer
      product_name:
        type: string
      quantity:
        type: integer
      subtotal:
        type: number
      unit_price:
        type: number
    type: object
  main.OrderItemInput:
    properties:
      inventory_id:
        type: integer
      quantity:
        minimum: 1
        type: integer
    required:
    - inventory_id
    - quantity
    type: object
  main.Product:
    properties:
      category_id:
        type: integer
      category_name:
        type: string
      description:
        type: string
      id:
        type: integer
      image_url:
        type: string
      inventory_number:
        type: string
      manufacturer_id:
        type: integer
      manufacturer_name:
        type: string
      name:
        type: string
      price:
        type: number
      quantity:
        type: integer
    type: object
  main.RegisterInput:
    properties:
      address:
        type: string
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  main.Row:
    properties:
      address:
        type: string
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      phone:
        type: string
      role:
        type: string
    type: object
  main.UpdateMeInput:
    properties:
      address:
        type: string
      full_name:
        type: string
      phone:
        type: string
    type: object
  main.UpdateOrderInput:
    properties:
      status:
        enum:
        - pending
        - confirmed
        - shipped
        - delivered
        - cancelled
        type: string
    required:
    - status
    type: object
  main.UpdatedResponse:
    properties:
      updated:
        type: boolean
    type: object
  main.UserMe:
    properties:
      address:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      phone:
        type: string
      role:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Shop API with auth, inventory, orders
  title: StockStore API
  version: "3.0"
paths:
  /admin/customers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Row'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: '[Admin]List all customers'
      tags:
      - admin
  /admin/inventory:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.InventoryItem'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: '[Admin]List inventory items'
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: Inventory data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.InventoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.IDResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: '[Admin]Create an inventory item'
      tags:
      - admin
  /admin/inventory/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Inventory ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.DeletedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: '[Admin]Update an inventory item'
      tags:
      - admin
    put:
      consumes:
      - application/json
      parameters:
      - description: Inventory ID
        in: path
        name: id
        required: true
        type: integer
      - description: Inventory data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.InventoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.UpdatedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: '[Admin]Update an inventory item'
      tags:
      - admin
  /admin/inventory{id}:
    get:
      parameters:
      - description: Inventory ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.InventoryItem'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: '[Admin]Get an inventory item'
      tags:
      - admin
  /admin/orders:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Order'
            type: array
      security:
      - BearerAuth: []
      summary: '[Admin] List all orders'
      tags:
      - admin
  /admin/orders/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: New status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.UpdateOrderInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.UpdatedResponse'
      security:
      - BearerAuth: []
      summary: '[Admin] Update order status'
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Login
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.RegisterInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Register new user
      tags:
      - auth
  /categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Category'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: List product categories
      tags:
      - lookup
  /manufacturers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Manufacturer'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: List manufacturers
      tags:
      - lookup
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.UserMe'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - auth
    put:
      consumes:
      - application/json
      parameters:
      - description: Profile data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.UpdateMeInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.UserMe'
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - auth
  /orders:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Order'
            type: array
      security:
      - BearerAuth: []
      summary: List current user's orders
      tags:
      - orders
    post:
      consumes:
      - application/json
      parameters:
      - description: Order data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.CreateOrderInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Place an order
      tags:
      - orders
  /orders/{id}:
    delete:
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.UpdatedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancel an order (only if pending)
      tags:
      - orders
    get:
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Order'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get order by ID (own orders only)
      tags:
      - orders
  /products:
    get:
      parameters:
      - description: Filter by category ID
        in: query
        name: category
        type: integer
      - description: Search by name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Product'
            type: array
      summary: List products (public catalog)
      tags:
      - products
  /products/{id}:
    get:
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Product'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get single product
      tags:
      - products
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
